line-length = 110
target-version = "py313"

[lint]
select = ["ALL"]
ignore = ["INP001", "CPY001", "D203", "D213", "COM812", "T201", "BLE001", "PLR2004", "C901", "PLR0912", "PLR0915"]
# En dashes are used deliberately in human-readable labels.
allowed-confusables = ["–"]

[lint.per-file-ignores]
# Line/segment definitions are data tables; long lines keep each entry on one line.
"scripts/data_build/build_lines.py" = ["E501"]
