name: PR agent

# Finishes a PR when the owner adds the `agent:finish` label (docs/CI-AGENT.md):
# regression screenshots against master, uploaded to pr-assets, then Claude evaluates them, rewrites the PR
# description (CLAUDE.md, docs/REGRESSION.md), and adds every problem it finds and every owner task as a resolvable
# review thread; it marks the PR ready only if it found no problems.
#
# The job passes whenever Claude finished its evaluation, even if it found problems: those block the merge as
# unresolved threads (master requires conversation resolution), not as a failed check. It fails only when the run
# itself failed (regression, upload, or Claude didn't finish).
#
# The commit status `agent-verdict`, set by this job on the PR's head commit, says the agent evaluated that
# commit: success when Claude finished. (Not the job itself: a job skipped by its `if`, e.g. when another label is
# added, counts as passed.) A new commit has no `agent-verdict`, so the agent has to run again on it.
on:
  pull_request:
    branches: [master]
    types: [labeled]

permissions:
  contents: write # push the screenshots to the pr-assets branch
  pull-requests: write # edit the description, review threads, mark ready, remove the label
  issues: write # labels live on the issue side of a PR
  statuses: write # the agent-verdict commit status
  id-token: write # Claude Code Action authentication

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finish:
    name: finish
    # Only the owner's label starts it: the agent reads PR content, so untrusted triggers are not allowed.
    if: github.event.label.name == 'agent:finish' && github.actor == 'ben-sembira-1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PR: ${{ github.event.pull_request.number }}
      ASSETS: https://media.githubusercontent.com/media/${{ github.repository }}/pr-assets/pr-${{ github.event.pull_request.number }}/regression
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: agent-verdict pending
        run: >-
          gh api "repos/${{ github.repository }}/statuses/$SHA" -f state=pending -f context=agent-verdict
          -f description="Claude is evaluating the regression" -f target_url="$RUN_URL"
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Google Maps key for the local builds
        env:
          MAPS_CI_KEY: ${{ secrets.MAPS_CI_KEY }}
        run: |
          if [ -z "$MAPS_CI_KEY" ]; then echo "::error::Missing the MAPS_CI_KEY secret (docs/CI-AGENT.md)"; exit 1; fi
          echo "VITE_GOOGLE_MAPS_API_KEY=$MAPS_CI_KEY" > .env.local

      - name: Regression screenshots against master
        run: npm run regression -- --browser chromium --assets "$ASSETS"

      - name: Upload the screenshots to pr-assets
        run: scripts/upload-pr-assets.sh "$PR"

      - name: Claude evaluates and finishes the PR
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are finishing pull request #${{ github.event.pull_request.number }} of ${{ github.repository }}.
            Follow CLAUDE.md and docs/REGRESSION.md exactly. Do not change any code or push anything.

            No one can approve a command here, so use only your allowed tools and run each command on its own, in
            exactly the allowed forms (`gh pr view|diff|edit|ready|comment …`, `gh api …`, `cat …`, `ls …`): no
            scripts (node, python, bash), pipes, redirects, heredocs, `$(…)`, `&&` or `;`. Write every text you
            send to a file in regression-output/ with the Write tool, then pass that file: the description with
            `gh pr edit ${{ github.event.pull_request.number }} --body-file regression-output/pr-body.md`, a comment
            with `gh pr comment ${{ github.event.pull_request.number }} --body-file <file>`, a review with
            `gh api <endpoint> --input <file>` (a JSON file).

            1. Read every image in regression-output/compare/ (this PR next to master) and the full-size images in
               regression-output/current/ and regression-output/master/. Read the PR diff (`gh pr diff`) to know what
               the PR intends to change.
               Then do the controls check of docs/REGRESSION.md on every full-size image in
               regression-output/current/ (not the comparison sheets, which are too small for it): every button,
               control and menu, including inside popups, cards, sheets and dialogs, fully visible, and about 8px
               or more from its own container's edges and from its neighbours. A failure counts even when master
               has it too.
            2. Rewrite the PR description with `gh pr edit --body-file`. Its structure, in order:
               - `# v<version>`, with the version from package.json;
               - what and why;
               - big images of the features the PR adds (desktop and phone), chosen from regression-output/current/
                 and linked from ${{ env.ASSETS }}/<file>;
               - the Regression section from regression-output/pr-regression.md. It starts with ONE bullet list of
                 every difference from master (name the commit), each saying why it is OK and expected, then the
                 statement that you evaluated all regression images against master, then the controls check
                 result (every failure with its image, control and side, or that all images passed), then the image
                 table.
            3. Add every problem you found as a resolvable review thread, one problem per thread: each unexpected
               difference, each failed control (image, control and side), and each scenario that couldn't be
               compared with master (n/a or error in pr-regression.md although the feature exists). Say what you
               saw, in which images (linked from ${{ env.ASSETS }}/<file>), and what would fix it. Owner tasks
               (console settings, secrets, publishing rules) are threads too, one task per thread, with the exact
               steps. Post them together as one review, `gh api
               repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews --input <file>`, with
               `"event": "COMMENT"` and a `comments` entry per thread on the most relevant line of the diff (`path`,
               `line`, `side`: "RIGHT"); for a problem with no such line, use the first changed line of the file
               closest to it. Read the existing threads first (`gh api
               repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`) and don't repeat
               one that is already there. Never put problems or tasks only in the description or a plain comment.
            4. If you found no problems, run `gh pr ready ${{ github.event.pull_request.number }}`. Otherwise leave the PR
               as a draft.
            5. Return the verdict: ok is true only if you found no problems; reason summarizes them and the number
               of threads you added.
          # The action splits these like a shell command line: quote each value, or the spaces in Bash(gh pr …:*)
          # split the rules and the JSON loses its double quotes.
          claude_args: |
            --permission-mode default
            --allowedTools 'Read,Glob,Grep,Write,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr edit:*),Bash(gh pr ready:*),Bash(gh pr comment:*),Bash(gh api:*),Bash(cat:*),Bash(ls:*)'
            --json-schema '{"type":"object","properties":{"ok":{"type":"boolean"},"reason":{"type":"string"}},"required":["ok","reason"]}'

      # Problems Claude found are review threads, which block the merge until resolved; they don't fail the job.
      # Only a run where Claude didn't finish (no verdict) fails.
      - name: Verdict
        id: verdict
        env:
          VERDICT: ${{ steps.claude.outputs.structured_output }}
        run: |
          echo "$VERDICT"
          if ! jq -e 'has("ok")' <<<"$VERDICT" > /dev/null 2>&1; then
            echo "::error::Claude didn't finish the evaluation (no verdict); see the Claude step"
            exit 1
          fi
          if [ "$(jq -r '.ok' <<<"$VERDICT")" = "true" ]; then
            echo "description=Claude evaluated the regression: no problems found" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Claude found problems (see the PR's review threads): $(jq -r '.reason' <<<"$VERDICT")"
            echo "description=Claude evaluated the regression: problems are in review threads" >> "$GITHUB_OUTPUT"
          fi

      - name: agent-verdict success
        if: success()
        run: >-
          gh api "repos/${{ github.repository }}/statuses/$SHA" -f state=success -f context=agent-verdict
          -f description="$DESCRIPTION" -f target_url="$RUN_URL"
        env:
          DESCRIPTION: ${{ steps.verdict.outputs.description }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: agent-verdict failure
        if: failure() || cancelled()
        run: >-
          gh api "repos/${{ github.repository }}/statuses/$SHA" -f state=failure -f context=agent-verdict
          -f description="The agent run failed before Claude finished; see the run" -f target_url="$RUN_URL"
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Remove the agent:finish label, so adding it again re-runs
        if: always()
        run: gh pr edit "$PR" --remove-label agent:finish
