name: PR agent

# Finishes a PR when the owner adds the `agent:finish` label (docs/CI-AGENT.md):
# regression screenshots against master, uploaded to pr-assets, then Claude evaluates them, rewrites the PR
# description (CLAUDE.md, docs/REGRESSION.md), adds owner tasks as review threads, and marks the PR ready only if
# every difference is expected.
#
# The required check is the commit status `agent-verdict`, set by this job on the PR's head commit: success only
# when Claude found every difference expected. (Not the job itself: a job skipped by its `if`, e.g. when another
# label is added, counts as passed.) A new commit has no `agent-verdict`, so the PR can't merge until the agent
# runs again on it.
on:
  pull_request:
    branches: [master]
    types: [labeled]

permissions:
  contents: write # push the screenshots to the pr-assets branch
  pull-requests: write # edit the description, review threads, mark ready, remove the label
  issues: write # labels live on the issue side of a PR
  statuses: write # the agent-verdict commit status
  id-token: write # Claude Code Action authentication

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finish:
    name: finish
    # Only the owner's label starts it: the agent reads PR content, so untrusted triggers are not allowed.
    if: github.event.label.name == 'agent:finish' && github.actor == 'ben-sembira-1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PR: ${{ github.event.pull_request.number }}
      ASSETS: https://media.githubusercontent.com/media/${{ github.repository }}/pr-assets/pr-${{ github.event.pull_request.number }}/regression
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: agent-verdict pending
        run: >-
          gh api "repos/${{ github.repository }}/statuses/$SHA" -f state=pending -f context=agent-verdict
          -f description="Claude is evaluating the regression" -f target_url="$RUN_URL"
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Google Maps key for the local builds
        env:
          MAPS_CI_KEY: ${{ secrets.MAPS_CI_KEY }}
        run: |
          if [ -z "$MAPS_CI_KEY" ]; then echo "::error::Missing the MAPS_CI_KEY secret (docs/CI-AGENT.md)"; exit 1; fi
          echo "VITE_GOOGLE_MAPS_API_KEY=$MAPS_CI_KEY" > .env.local

      - name: Regression screenshots against master
        run: npm run regression -- --browser chromium --assets "$ASSETS"

      - name: Upload the screenshots to pr-assets
        run: scripts/upload-pr-assets.sh "$PR"

      - name: Claude evaluates and finishes the PR
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are finishing pull request #${{ github.event.pull_request.number }} of ${{ github.repository }}.
            Follow CLAUDE.md and docs/REGRESSION.md exactly. Do not change any code or push anything.

            1. Read every image in regression-output/compare/ (this PR next to master) and the full-size images in
               regression-output/current/ and regression-output/master/. Read the PR diff (`gh pr diff`) to know what
               the PR intends to change.
               In every image (desktop and phone), also check that each button, control and open menu is fully
               visible and usable: not covered by or covering another control (ours, or Google's zoom +/−, map
               type, camera and fullscreen controls), not cut off by the screen edge or a panel, and with clear
               space around it (about 8px or more from its neighbours). A control that fails this is a problem to
               report even when master has it too.
            2. Rewrite the PR description with `gh pr edit --body-file`. Its structure, in order:
               - `# v<version>`, with the version from package.json;
               - what and why;
               - big images of the features the PR adds (desktop and phone), chosen from regression-output/current/
                 and linked from ${{ env.ASSETS }}/<file>;
               - the Regression section from regression-output/pr-regression.md. It starts with ONE bullet list of
                 every difference from master (name the commit), each saying why it is OK and expected, then the
                 statement that you evaluated all regression images against master, then the image table.
            3. Owner tasks (console settings, secrets, publishing rules) go as review comment threads on the relevant
               diff lines (`gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews`),
               never in the description. Don't duplicate threads that already exist.
            4. If every difference is expected, run `gh pr ready ${{ github.event.pull_request.number }}`. If any is
               not, leave the PR as a draft and comment (`gh pr comment`) which differences are unexpected and why.
            5. Return the verdict: ok is true only if every difference is expected.
          # The action splits these like a shell command line: quote each value, or the spaces in Bash(gh pr …:*)
          # split the rules and the JSON loses its double quotes.
          claude_args: |
            --permission-mode default
            --allowedTools 'Read,Glob,Grep,Write,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr edit:*),Bash(gh pr ready:*),Bash(gh pr comment:*),Bash(gh api:*),Bash(cat:*),Bash(ls:*)'
            --json-schema '{"type":"object","properties":{"ok":{"type":"boolean"},"reason":{"type":"string"}},"required":["ok","reason"]}'

      - name: Verdict
        env:
          VERDICT: ${{ steps.claude.outputs.structured_output }}
        run: |
          echo "$VERDICT"
          if [ "$(jq -r '.ok' <<<"$VERDICT")" != "true" ]; then
            echo "::error::Unexpected regression differences: $(jq -r '.reason' <<<"$VERDICT")"
            exit 1
          fi

      - name: agent-verdict success
        if: success()
        run: >-
          gh api "repos/${{ github.repository }}/statuses/$SHA" -f state=success -f context=agent-verdict
          -f description="Claude evaluated the regression: every difference is expected" -f target_url="$RUN_URL"
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: agent-verdict failure
        if: failure() || cancelled()
        run: >-
          gh api "repos/${{ github.repository }}/statuses/$SHA" -f state=failure -f context=agent-verdict
          -f description="Unexpected differences or a failed run; see the PR comment and the run" -f target_url="$RUN_URL"
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Remove the agent:finish label, so adding it again re-runs
        if: always()
        run: gh pr edit "$PR" --remove-label agent:finish
