name: release-deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: read

concurrency:
  group: release-deploy
  cancel-in-progress: false

jobs:
  release:
    name: tag release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: false
      - name: Determine bump from the merged PR label
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: scripts/release-version.sh
      - name: Push tag
        if: steps.bump.outputs.created == 'true'
        run: git push origin "refs/tags/${{ steps.bump.outputs.version }}"

  deploy:
    name: build and deploy pages
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: false
      - name: Fetch tags created by the release job
        run: git fetch --force --tags origin
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          APP_VERSION: ${{ needs.release.outputs.version }}
        run: |
          echo "version: ${APP_VERSION}"
          echo "reference data tag: $(git describe --tags --abbrev=0 --match 'reference-update-*' || echo none)"
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
