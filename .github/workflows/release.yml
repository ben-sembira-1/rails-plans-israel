name: Release and deploy

# On every merge to master: tag the commit vX.Y.Z (from package.json) and deploy the site to GitHub Pages.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Shared with construction-data.yml, so a release and the daily data update never deploy over each other.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  LIVE_DATA_URL: https://ben-sembira-1.github.io/rails-plans-israel/data/construction.json

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Reuse the snapshot that is live now, so a release never calls the city APIs; only the very first deploy
      # (no live file yet) fetches it.
      - name: Construction snapshot
        run: |
          mkdir -p public/data
          if ! curl -fsSL --retry 3 -o public/data/construction.json "$LIVE_DATA_URL"; then
            npm run construction:fetch -- public/data/construction.json
          fi
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAP_ID: ${{ vars.VITE_GOOGLE_MAP_ID }}
      - name: Read version
        id: version
        run: echo "version=$(node scripts/version.ts current)" >> "$GITHUB_OUTPUT"
      - name: Tag the release
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            if [ "$(git rev-list -n 1 "$TAG")" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG already tags another commit; bump the version in package.json"
              exit 1
            fi
            echo "$TAG already tags this commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "refs/tags/$TAG"
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
