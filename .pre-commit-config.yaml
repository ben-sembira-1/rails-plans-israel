# Install: pip install pre-commit && pre-commit install
# Run on everything: pre-commit run --all-files
default_install_hook_types: [pre-commit, commit-msg]
exclude: ^(references/raw/|public/references/|references/text/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, master]
        stages: [pre-commit]
      - id: check-added-large-files
        args: [--maxkb=1024, --enforce-all]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/crate-ci/typos
    rev: v1.52.2
    hooks:
      - id: typos

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.11.1
    hooks:
      - id: editorconfig-checker
        alias: ec

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --check --ignore-unknown
        language: system
        types_or: [ts, tsx, javascript, json, css, html, markdown, yaml]
      - id: eslint
        name: eslint
        entry: npx eslint --max-warnings=0 --no-warn-ignored
        language: system
        types_or: [ts, tsx]
      - id: markdownlint
        name: markdownlint
        entry: npx markdownlint-cli2
        language: system
        types: [markdown]
      - id: stylelint
        name: stylelint
        entry: npx stylelint
        language: system
        types: [css]
      - id: tsc
        name: typescript (strict)
        entry: npx tsc -b
        language: system
        pass_filenames: false
        types_or: [ts, tsx, json]
      - id: validate-data
        name: validate data + manifest
        entry: npm run --silent validate-data
        language: system
        pass_filenames: false
        files: ^(src/data/|references/manifest\.json|scripts/validate-data\.ts)
      - id: vitest
        name: vitest
        entry: npx vitest related --run --passWithNoTests
        language: system
        types_or: [ts, tsx]
      - id: lfs-raw-only
        name: references/raw must be stored in Git LFS
        entry: scripts/check-lfs.sh
        language: script
        pass_filenames: false
        always_run: true
