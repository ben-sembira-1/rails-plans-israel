# Run locally with `pre-commit install` (once) and on demand with `pre-commit run --all-files`.
# CI runs the same hooks. The local hooks use the project's node_modules, so run `npm ci` first.
# Secret scanning: `gitleaks` checks the staged changes on every commit; CI also runs `gitleaks-history` (manual
# stage) over the whole git history: `pre-commit run gitleaks-history --hook-stage manual`.
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=600']
      - id: mixed-line-ending
        args: ['--fix=lf']
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
      - id: gitleaks
        alias: gitleaks-history
        name: gitleaks (full git history)
        entry: gitleaks git --redact --verbose
        pass_filenames: false
        always_run: true
        stages: [manual]
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx --no-install prettier --check --ignore-unknown
        language: system
        types: [text]
      - id: eslint
        name: eslint
        entry: npx --no-install eslint --max-warnings 0
        language: system
        files: \.(ts|tsx)$
      - id: typecheck
        name: typecheck (tsc -b)
        entry: npx --no-install tsc -b --noEmit
        language: system
        pass_filenames: false
        files: \.(ts|tsx|json)$
